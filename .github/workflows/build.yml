name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform 34
        run: |
          set -e
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            SDKMAN=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          fi
          echo "sdkmanager=$SDKMAN"
          yes | "$SDKMAN" --licenses > /dev/null || true
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            "$SDKMAN" --install "platforms;android-34"
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            "$SDKMAN" --install "build-tools;34.0.0"
          fi

      - name: Install Gradle 8.2
        run: |
          set -e
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Gradle version
        run: gradle --version

      - name: Verify hooks are read-only
        run: |
          set -e
          # Look for mutation APIs in real code only (comment lines are ignored).
          HITS=$(grep -rnE 'setResult|setThrowable|param\.args\[[0-9]+\] *=' app/src/main/java || true)
          CODE_HITS=$(printf '%s\n' "$HITS" | grep -vE ':[0-9]+:[[:space:]]*(\*|//)' || true)
          if [ -n "$CODE_HITS" ]; then
            echo "$CODE_HITS"
            echo "ERROR: tracer must never modify params, results or exceptions"
            exit 1
          fi
          echo "OK: no result/arg/throwable mutation in code"

      - name: Compile check (debug)
        run: gradle :app:compileDebugJavaWithJavac --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace

      # Debug variant is signed with the debug keystore, i.e. directly installable.
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify xposed_init is packaged
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "apk=$APK"
          unzip -l "$APK" | grep -E 'assets/xposed_init' || {
            echo "assets/xposed_init missing from APK"; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: oplus-ota-tracer
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
